[project]
name = "dca-vs-lump-sum"
version = "0.1.0"
description = "Got a lump sum to invest? Compare investing it all at once with spreading it over several months."
requires-python = ">=3.12"
license = { text = "MIT" }

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "N", "RUF", "PTH"]

[tool.mypy]
python_version = "3.12"
packages = ["dca_vs_lump"]
strict = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["plotly.*", "streamlit.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "--cov=dca_vs_lump --cov-report=term-missing --cov-fail-under=85"
